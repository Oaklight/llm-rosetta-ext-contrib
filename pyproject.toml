[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-rosetta-shim-opendesign"
dynamic = ["version"]
description = "Open Design Cloud provider shim for llm-rosetta, delivered as a plugin package"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Oaklight" }]
keywords = ["llm", "llm-rosetta", "shim", "opendesign", "open-design"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "License :: OSI Approved :: MIT License",
]
# The vendor manifest (``providers/opendesign/provider.yaml``) carries the mark
# as a manifest-level ``logo:``.  dev30 and everything before it refuses that
# file ("a vendor manifest may declare only a 'connection:' block"), so the
# floor is the first dev that reads identity from a manifest; 0.14.0 and later
# satisfy it too, since a final release sorts above its dev releases.
dependencies = ["llm-rosetta>=0.14.0.dev31"]

[project.urls]
Repository = "https://github.com/Oaklight/llm-rosetta-shim-opendesign"
Upstream = "https://github.com/Oaklight/llm-rosetta"

[project.entry-points."llm_rosetta.shim_providers"]
opendesign = "llm_rosetta_shim_opendesign:register_shims"

[tool.setuptools.dynamic]
version = { attr = "llm_rosetta_shim_opendesign.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
llm_rosetta_shim_opendesign = ["providers/**/*.yaml", "providers/**/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]

name: Release
# Publishes every extension's wheel and index.json as one GitHub release.
# `llm-rosetta ext install <id>` and `ext update` read the latest release's
# index.json, so run this after a change to an extension is merged.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. r2026.11.25"
        required: true

permissions:
  contents: write

env:
  CORE_SPEC: "llm-rosetta>=0.14.0.dev42"
  CORE_INDEX: "https://test.pypi.org/simple/"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --pre "$CORE_SPEC" --extra-index-url "$CORE_INDEX"
      - name: Check before publishing
        run: |
          python scripts/check_layout.py
          python scripts/gen_readme_table.py --check
          python scripts/check_wheels.py
      - name: Fetch the previous index (older versions stay installable)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download --pattern index.json --output previous-index.json || echo "no previous release"
      - name: Build the wheels and the index
        run: |
          python scripts/build_index.py --out dist \
            --base-url "https://github.com/${{ github.repository }}/releases/download/${{ inputs.tag }}" \
            --previous previous-index.json
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ inputs.tag }}" dist/*.whl dist/index.json \
            --title "${{ inputs.tag }}" \
            --notes "Extension wheels and index.json. Install with: llm-rosetta ext install <id>"

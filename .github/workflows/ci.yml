name: CI

on:
  push:
    branches: [main, next]
  pull_request:

env:
  # The core is a two-package monorepo; without the subdirectory pip clones the
  # repository root and finds no project there.
  CORE: "llm-rosetta @ git+https://github.com/Oaklight/llm-rosetta.git@master#subdirectory=packages/llm-rosetta"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install llm-rosetta (master)
        run: |
          # The parent's test-fixture submodule is addressed as git@github.com:;
          # rewrite it to HTTPS, which the runner can clone without a key.
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          pip install "$CORE"
      - name: Install the shim package
        # Not editable: the tests run against what a wheel ships (entry points,
        # package data), and the floor (a development core) may not be on
        # PyPI, so core comes from git master above and --no-deps keeps pip
        # from resolving it again.
        run: |
          pip install --no-deps .
          pip install pytest pyyaml
      - name: Run tests
        run: pytest tests -q

  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The archives and the manifest are what a gateway installs from, so the
      # release builder runs here in dry-run on every change.  It needs no
      # dependency, so it runs before anything is installed.
      - name: Check the per-vendor archive layout
        run: python scripts/build_shim_archive.py
      - name: Build the manifest (dry run) and validate it against the spec
        run: |
          set -euo pipefail
          # Against the manifest already on `dist`, a vendor whose archive
          # changed without a version bump fails here, before the tag does.
          args=()
          if git fetch -q origin dist && git cat-file -e FETCH_HEAD:manifest.json 2>/dev/null; then
            git show FETCH_HEAD:manifest.json > "$RUNNER_TEMP/previous.json"
            args+=(--previous "$RUNNER_TEMP/previous.json")
          fi
          python scripts/build_manifest.py --dry-run "${args[@]}" > manifest.json
          python scripts/build_manifest.py --check manifest.json
      - name: Validate against core's schema, when core ships one
        # The manifest schema is planned as
        # llm_rosetta/contracts/shim_manifest.schema.json (Oaklight/llm-rosetta#1660).
        # Until core master carries it, this step reports the skip and passes.
        run: |
          set -euo pipefail
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          pip install jsonschema "$CORE"
          python - <<'PY'
          import json
          from importlib.resources import files

          schema = files("llm_rosetta.contracts").joinpath("shim_manifest.schema.json")
          if not schema.is_file():
              print("core ships no shim_manifest.schema.json yet; skipped")
              raise SystemExit(0)
          import jsonschema

          doc = json.load(open("manifest.json"))
          errors = list(
              jsonschema.Draft202012Validator(json.loads(schema.read_text())).iter_errors(doc)
          )
          # Temporary (Oaklight/llm-rosetta#1660 S7): core master's schema still
          # requires `<vendor>--<name>`; the core PR that moves these vendors
          # out accepts the bare vendor key too.  Only a shim name equal to its
          # own vendor key is tolerated; drop this filter once that PR merges.
          def _bare_vendor_name(err):
              path = list(err.absolute_path)
              return (
                  len(path) == 6
                  and path[0] == "vendors"
                  and path[4] == "shims"
                  and err.instance == path[1]
              )
          pending = [e for e in errors if _bare_vendor_name(e)]
          others = [e for e in errors if not _bare_vendor_name(e)]
          for e in pending:
              print(f"pending core change: {e.instance!r} is a bare vendor-key shim name")
          for e in others:
              print(f"invalid: {list(e.absolute_path)}: {e.message}")
          if others:
              raise SystemExit(1)
          print("manifest.json validates against core's schema")
          PY

  collisions:
    # Shim names do not change when a vendor moves between core and contrib,
    # so contrib must never ship a name core's built-ins already register.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install llm-rosetta (master)
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          pip install "$CORE"
      - name: Check contrib's shim names against core's
        # Temporary allow list (Oaklight/llm-rosetta#1660 S7): the vendors
        # moving out of core collide until the core PR that removes them
        # merges.  The check names each entry that stops overlapping; delete
        # the file and this flag once it is empty.
        run: python scripts/check_core_collisions.py --allow-file scripts/moving_from_core.txt

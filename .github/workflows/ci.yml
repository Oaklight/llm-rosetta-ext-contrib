name: CI
on:
  pull_request:
  push:
    branches: [main]

# llm-rosetta 0.14.0 is not on PyPI yet: install the development pair from
# TestPyPI. When 0.14.0 ships, drop the pre-release flag and the extra index.
env:
  CORE_SPEC: "llm-rosetta>=0.14.0.dev0"
  CORE_INDEX: "https://test.pypi.org/simple/"

jobs:
  layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_layout.py
      - run: python scripts/gen_readme_table.py --check

  packages:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --pre "$CORE_SPEC" pytest --extra-index-url "$CORE_INDEX"
      - name: Check every folder and every wheel
        run: |
          for folder in packages/*/; do llm-rosetta ext check "$folder" --no-build; done
          python scripts/check_wheels.py
      - name: Test the packages this change touches
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ids=$(python scripts/changed_packages.py --base "origin/${{ github.base_ref }}")
          else
            ids=$(python scripts/changed_packages.py)
          fi
          echo "testing: $ids"
          for id in $ids; do python -m pytest "packages/$id" -q; done
          python -m pytest tests -q

  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --pre "$CORE_SPEC" --extra-index-url "$CORE_INDEX"
      - name: The index builds and the installer reads it
        run: python scripts/build_index.py --relative --out dist

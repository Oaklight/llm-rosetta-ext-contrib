name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_layout.py
  # TODO: per-package test jobs, selected by the changed packages/<id> paths.

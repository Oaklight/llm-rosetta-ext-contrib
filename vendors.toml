# Drives the local `agy` CLI over ACP; agy holds the Google sign-in, so the
# gateway sends no credential (keyless).  The strict-profile measures were
# made against agy 1.5.13 (core commit of 2026-11-19); never configured on the
# production gateway.  A live `agy acp` tool round trip on 1.5.14 is recorded
# (tool call out, client result back, agent reply); 1.5.14 names the MCP tool
# directly, and the hook covers both that shape and the 1.5.13 meta-tool.
# `tools` is in the shim's default capabilities.  0.5.4 adds the vendor-managed
# auth exchange behind the admin sign-in button.  0.5.5 reads a `--gemini-dir`
# already in the configured command, so the sign-in follows the install the
# operator selected (another agy version) instead of assuming the default one.
# It also mirrors the core's three-state `acp.harden` (by name / force / off),
# so a renamed or wrapped install signs in where the agent runs.  0.5.6 asks
# the agent for its sign-in state when the keyring cannot be read, and gives
# secret-tool the session-bus variables a login session sets, so the card names
# the Google account under a service manager.
[vendors.antigravity]
version = "0.5.6"
maturity = "beta"
since = "2026-11-23"
tags = ["tier:subscription", "auth:cli"]

# Claude through the Claude Agent SDK's ACP adapter.  The adapter runs Claude
# Code and reads the host's `claude auth login` store; the gateway sends no
# credential (keyless).  Experimental: the adapter is versioned independently
# and its permission surface is larger than the gateway can see.  A live tool
# round trip through a Pro subscription on adapter 0.109.1 / Claude Code
# 2.1.299 is recorded (tool call out, client result back, agent reply), so
# `tools` is on by default.  The enterprise profile hit its 5-hour limit; a
# clean CLAUDE_CONFIG_DIR is recommended.  0.2.0 uses connection.acp_env, so
# publish it only to gateways running a core that reads that field
# (llm-rosetta#1675); an older core ignores it and leaves Claude Code's tool
# search on.  `since` is the latest dated live record.  0.2.1 adds the
# vendor-managed auth exchange behind the admin sign-in button, so it needs the
# core that honours ``vendor_managed`` (llm-rosetta#1681).  0.2.2 keeps the
# adapter's npm cache in the lane's persistent home, so an image upgrade — or
# a switch to another pinned adapter version — reuses the install on the
# mounted volume instead of downloading it again.  0.2.3 signs in through the
# Claude Code build the adapter installed in that cache and keeps the sign-in
# to one browser page: the CLI no longer opens a second tab, and a pasted
# callback address is replayed on the gateway host.  0.2.4 disables Claude
# Code's built-in tools from the session `_meta`, removes Anthropic billing
# variables from the agent and sign-in environments, and names the CLI's
# account email in the Authentication card.
[vendors.claude]
version = "0.2.4"
maturity = "experimental"
since = "2026-11-23"
tags = ["tier:subscription", "auth:cli"]


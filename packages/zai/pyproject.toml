[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-rosetta-ext-zai"
version = "0.5.1"
description = "llm-rosetta extension: Z.ai shims"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Oaklight" }]
# Standard library only beyond core: an extension must run where pip is absent.
dependencies = ["llm-rosetta>=0.14.0"]

[project.entry-points."llm_rosetta.extensions"]
zai = "llm_rosetta_ext.zai"

# The folder is the package: no src/ and no inner directory.  The import name
# is mapped onto "." and the packages are listed, so tests/ and the packaging
# files stay out of the wheel.
[tool.setuptools]
package-dir = { "llm_rosetta_ext.zai" = "." }
packages = ["llm_rosetta_ext.zai", "llm_rosetta_ext.zai.build.lib.llm_rosetta_ext.zai", "llm_rosetta_ext.zai.build.lib.llm_rosetta_ext.zai.build.lib.llm_rosetta_ext.zai"]

[tool.setuptools.package-data]
"llm_rosetta_ext.zai" = ["plugin.yaml", "build/lib/llm_rosetta_ext/zai/build/lib/llm_rosetta_ext/zai/embeddings/provider.yaml", "build/lib/llm_rosetta_ext/zai/build/lib/llm_rosetta_ext/zai/llm/chat_completions/provider.yaml", "build/lib/llm_rosetta_ext/zai/build/lib/llm_rosetta_ext/zai/llm/messages/provider.yaml", "build/lib/llm_rosetta_ext/zai/build/lib/llm_rosetta_ext/zai/provider.yaml", "build/lib/llm_rosetta_ext/zai/build/lib/llm_rosetta_ext/zai/rerank/provider.yaml", "build/lib/llm_rosetta_ext/zai/embeddings/provider.yaml", "build/lib/llm_rosetta_ext/zai/llm/chat_completions/provider.yaml", "build/lib/llm_rosetta_ext/zai/llm/messages/provider.yaml", "build/lib/llm_rosetta_ext/zai/provider.yaml", "build/lib/llm_rosetta_ext/zai/rerank/provider.yaml", "embeddings/provider.yaml", "llm/chat_completions/provider.yaml", "llm/messages/provider.yaml", "provider.yaml", "rerank/provider.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

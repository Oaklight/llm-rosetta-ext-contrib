[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-rosetta-ext-groq"
version = "0.5.1"
description = "llm-rosetta extension: Groq shims"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Oaklight" }]
# Standard library only beyond core: an extension must run where pip is absent.
dependencies = ["llm-rosetta>=0.14.0"]

[project.entry-points."llm_rosetta.extensions"]
groq = "llm_rosetta_ext.groq"

# The folder is the package: no src/ and no inner directory.  The import name
# is mapped onto "." and the packages are listed, so tests/ and the packaging
# files stay out of the wheel.
[tool.setuptools]
package-dir = { "llm_rosetta_ext.groq" = "." }
packages = ["llm_rosetta_ext.groq", "llm_rosetta_ext.groq.build.lib.llm_rosetta_ext.groq", "llm_rosetta_ext.groq.build.lib.llm_rosetta_ext.groq.build.lib.llm_rosetta_ext.groq"]

[tool.setuptools.package-data]
"llm_rosetta_ext.groq" = ["plugin.yaml", "build/lib/llm_rosetta_ext/groq/build/lib/llm_rosetta_ext/groq/llm/provider.yaml", "build/lib/llm_rosetta_ext/groq/build/lib/llm_rosetta_ext/groq/llm/transforms.py", "build/lib/llm_rosetta_ext/groq/build/lib/llm_rosetta_ext/groq/provider.yaml", "build/lib/llm_rosetta_ext/groq/llm/provider.yaml", "build/lib/llm_rosetta_ext/groq/llm/transforms.py", "build/lib/llm_rosetta_ext/groq/provider.yaml", "llm/provider.yaml", "llm/transforms.py", "provider.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-rosetta-ext-ovhcloud"
version = "0.4.1"
description = "llm-rosetta extension: OVHcloud AI Endpoints free tier (shim)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Oaklight" }]
# Standard library only beyond core: an extension must run where pip is absent.
dependencies = ["llm-rosetta>=0.14.0.dev40"]

[project.entry-points."llm_rosetta.extensions"]
ovhcloud = "llm_rosetta_ext.ovhcloud"

# The folder is the package: no src/ and no inner directory.
[tool.setuptools]
package-dir = { "llm_rosetta_ext.ovhcloud" = "." }
packages = ["llm_rosetta_ext.ovhcloud"]

[tool.setuptools.package-data]
"llm_rosetta_ext.ovhcloud" = ["plugin.yaml", "provider.yaml", "llm/provider.yaml", "llm/transforms.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]

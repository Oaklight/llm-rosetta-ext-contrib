[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-rosetta-ext-siliconflow"
version = "0.5.1"
description = "llm-rosetta extension: SiliconFlow shims"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Oaklight" }]
# Standard library only beyond core: an extension must run where pip is absent.
dependencies = ["llm-rosetta>=0.14.0"]

[project.entry-points."llm_rosetta.extensions"]
siliconflow = "llm_rosetta_ext.siliconflow"

# The folder is the package: no src/ and no inner directory.  The import name
# is mapped onto "." and the packages are listed, so tests/ and the packaging
# files stay out of the wheel.
[tool.setuptools]
package-dir = { "llm_rosetta_ext.siliconflow" = "." }
packages = ["llm_rosetta_ext.siliconflow", "llm_rosetta_ext.siliconflow.build.lib.llm_rosetta_ext.siliconflow", "llm_rosetta_ext.siliconflow.build.lib.llm_rosetta_ext.siliconflow.build.lib.llm_rosetta_ext.siliconflow"]

[tool.setuptools.package-data]
"llm_rosetta_ext.siliconflow" = ["plugin.yaml", "build/lib/llm_rosetta_ext/siliconflow/build/lib/llm_rosetta_ext/siliconflow/embeddings/provider.yaml", "build/lib/llm_rosetta_ext/siliconflow/build/lib/llm_rosetta_ext/siliconflow/embeddings/transforms.py", "build/lib/llm_rosetta_ext/siliconflow/build/lib/llm_rosetta_ext/siliconflow/llm/provider.yaml", "build/lib/llm_rosetta_ext/siliconflow/build/lib/llm_rosetta_ext/siliconflow/llm/transforms.py", "build/lib/llm_rosetta_ext/siliconflow/build/lib/llm_rosetta_ext/siliconflow/provider.yaml", "build/lib/llm_rosetta_ext/siliconflow/build/lib/llm_rosetta_ext/siliconflow/rerank/provider.yaml", "build/lib/llm_rosetta_ext/siliconflow/build/lib/llm_rosetta_ext/siliconflow/rerank/transforms.py", "build/lib/llm_rosetta_ext/siliconflow/embeddings/provider.yaml", "build/lib/llm_rosetta_ext/siliconflow/embeddings/transforms.py", "build/lib/llm_rosetta_ext/siliconflow/llm/provider.yaml", "build/lib/llm_rosetta_ext/siliconflow/llm/transforms.py", "build/lib/llm_rosetta_ext/siliconflow/provider.yaml", "build/lib/llm_rosetta_ext/siliconflow/rerank/provider.yaml", "build/lib/llm_rosetta_ext/siliconflow/rerank/transforms.py", "embeddings/provider.yaml", "embeddings/transforms.py", "llm/provider.yaml", "llm/transforms.py", "provider.yaml", "rerank/provider.yaml", "rerank/transforms.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]

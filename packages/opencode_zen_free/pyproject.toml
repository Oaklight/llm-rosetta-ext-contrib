[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-rosetta-ext-opencode-zen-free"
version = "0.4.1"
description = "llm-rosetta extension: OpenCode (Zen) free tier (shim)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Oaklight" }]
# Standard library only beyond core: an extension must run where pip is absent.
dependencies = ["llm-rosetta>=0.14.0.dev40"]

[project.entry-points."llm_rosetta.extensions"]
opencode_zen_free = "llm_rosetta_ext.opencode_zen_free"

# The folder is the package: no src/ and no inner directory.
[tool.setuptools]
package-dir = { "llm_rosetta_ext.opencode_zen_free" = "." }
packages = ["llm_rosetta_ext.opencode_zen_free", "llm_rosetta_ext.opencode_zen_free.llm"]

[tool.setuptools.package-data]
"llm_rosetta_ext.opencode_zen_free" = ["plugin.yaml", "provider.yaml"]
"llm_rosetta_ext.opencode_zen_free.llm" = ["provider.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

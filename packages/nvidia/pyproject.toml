[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-rosetta-ext-nvidia"
version = "0.5.1"
description = "llm-rosetta extension: NVIDIA shims"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Oaklight" }]
# Standard library only beyond core: an extension must run where pip is absent.
dependencies = ["llm-rosetta>=0.14.0.dev40"]

[project.entry-points."llm_rosetta.extensions"]
nvidia = "llm_rosetta_ext.nvidia"

# The folder is the package: no src/ and no inner directory.  The import name
# is mapped onto "." and the packages are listed, so tests/ and the packaging
# files stay out of the wheel.
[tool.setuptools]
package-dir = { "llm_rosetta_ext.nvidia" = "." }
packages = ["llm_rosetta_ext.nvidia"]

[tool.setuptools.package-data]
"llm_rosetta_ext.nvidia" = ["llm/provider.yaml", "plugin.yaml", "provider.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

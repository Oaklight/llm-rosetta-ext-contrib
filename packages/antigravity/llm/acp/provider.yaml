# Antigravity, served by the vendor's own CLI over ACP.
#
# ``agy`` owns the Google sign-in; this lane never sees a credential, so the
# vendor manifest declares it keyless.  Sign in on the gateway host first:
# run ``agy`` in a terminal and complete the Google sign-in (or
# ``agy acp --login``).  An unsigned-in agent refuses to open a session, and
# the gateway reports that as a 503 naming the sign-in step.
#
# The account rules are Google's: it may suspend an account it sees used
# outside Antigravity's own client.  Running agy is the least indirect way to
# use the plan; it is still a plan that can be lost.  See the provider guide.
#
# The gateway gives the lane a persistent ``--gemini-dir`` under its data
# directory and drives the admin sign-in with the same flag.  On a headless
# host, where there is no keyring, agy's file-based token fallback lands
# there; mount the data directory on a volume to keep the login across
# restarts and image upgrades.  Set ``acp.home`` to use another saved profile.
name: antigravity--acp
model_type: llm
format: acp
group_label: Google (Antigravity)
logo: https://cdn.jsdelivr.net/npm/@lobehub/icons-static-svg@1.104.0/icons/antigravity.svg

# What a model on this lane has when its config entry declares no
# ``capabilities``.  Images ride as inline ACP blocks and thought chunks come
# back as thinking blocks.  Client tools travel over the loopback MCP bridge;
# a live round trip through ``agy`` 1.5.14 is recorded, so ``tools`` is on by
# default.
default_capabilities: [text, vision, reasoning, tools]

connection:
  # The lane is reached by starting a process, not by dialing this host.  It
  # is a placeholder that must be a URL (the transport contract is shared
  # with the HTTP lanes) and is never opened.
  base_url: http://agy.local
  transport: acp
  # agy approves its own tools by default, which would hand the gateway host
  # to every client of the gateway.  The transport therefore starts agy in a
  # gateway-owned profile (it appends ``--gemini-dir <acp_home>``,
  # ``--agent gateway-text-only`` and ``--process-per-session`` to this
  # command) and writes the profile before every turn: a no-tools agent, a
  # PreToolUse hook that permits only the gateway's loopback MCP server,
  # ``toolPermission: strict`` and ``permissions.allow: ["mcp(*)"]``.  A tool
  # the API request declares is served over that MCP server; every built-in
  # tool request is refused.  This command is the base the profile flags are
  # added to.  An ``agy`` command written on a provider entry keeps the
  # profile; a renamed or wrapped command needs ``acp.harden: true``, and
  # ``acp.harden: false`` is the opt-out that runs it as written.  A command
  # with no literal ``acp`` token (a shell string) cannot be signed in from
  # the panel; the exchange refuses rather than guessing.
  acp_argv: ["agy", "acp", "--dangerously-skip-permissions=false"]

# The ACP turn reports only token counts; the account's allowance is on the
# CLI's own ``/usage`` command.  The gateway runs it with this lane's profile
# (same sign-in, same Google account) and the probe decodes the JSON.  The
# command takes the profile through the app-data environment because print
# mode does not accept ``--gemini-dir``.
quota:
  probe: antigravity_usage
  local:
    argv: ["{acp_argv0}", "-p", "/usage", "--output-format", "json"]
    env:
      ANTIGRAVITY_APP_DATA_DIR: "{acp_home}"
    timeout: 60

hint_msg:
  en: >-
    Runs the local agy CLI over ACP. Google may suspend an account it sees
    used outside Antigravity's own client; use an account you can afford to
    lose. Sign in on the gateway host first (run agy in a terminal, or use the
    admin panel's Sign in button). The Authentication card names the Google
    account when the gateway can read the keyring; on a host where it cannot,
    Test asks the agent, so a signed-out lane fails with the agent's own
    message rather than an absent local record. agy runs
    in a profile the gateway owns: its own tools (files, shell, web search)
    are disabled, and a turn in which agy starts one fails with HTTP 502.
    Client tools declared by the API request are bridged through a loopback
    MCP server, so tool calls and results travel over ACP (live-verified on
    agy 1.5.14). The gateway keeps the login in a persistent profile under
    its data directory; mount that directory on a volume to reuse the login
    after a restart or image upgrade, and set acp.home to switch profiles.
    An agy command written on the provider entry keeps this
    protection; a renamed or wrapped command needs acp.harden:
    true, and false opts out and can re-enable host tools. A
    command with no literal acp token cannot be signed in from
    the panel.
  zh: >-
    通过 ACP 驱动本机 agy CLI。Google 可能封禁被判定在 Antigravity 之外使用的账号，
    请只使用可以承受损失的账号。先在网关主机上登录（在终端运行 agy，或用管理面板的
    Sign in 按钮）。网关能读取 keyring 时，Authentication 卡片会显示 Google 账号；
    读取不到时，Test 会询问 agent，未登录的通道以 agent 自己的提示失败，而不是依据
    本地没有记录。agy 运行在网关自有的配置目录中，其自带工具（文件、命令行、网页搜索）全部禁用；
    agy 一旦启动自带工具，该轮请求返回 HTTP 502。API 请求声明的客户端工具通过
    回环 MCP 服务器桥接，工具调用与结果经 ACP 往返（已在 agy 1.5.14 上实测）。
    网关把登录保存在数据目录下的持久配置中；把数据目录挂载到卷上，重启或升级镜像后
    仍可复用登录，也可设置 acp.home 切换配置。
    在 provider 配置中改写的 agy 命令仍保留上述保护；改名或包装的命令需设置 acp.harden: true，设为 false 则退出保护并可能重新启用主机工具。命令中没有字面量 acp 子命令时，面板无法为它启动登录。

# One manifest per extension folder.  Draft schema: see AGENTS.md.
id: antigravity
name: Google (Antigravity)
version: 0.5.6
maturity: beta
tags: ["tier:subscription", "auth:cli"]
requires:
  surface: 1
  ir: 1
provides:
  shims: [antigravity--acp]
external:
  - name: agy
    check: ["agy", "--version"]
    install:
      version: "1.5.15"
      release:
        url: "https://github.com/google-antigravity/antigravity-cli/releases/download/{version}/agy_cli_{platform}.tar.gz"
        sha256:
          linux_x64_musl: "a12514fb33e8835186082a00b60725f6fb15941ba061f0403347b86c4dbd8f46"
          linux_arm64_musl: "455d20cc37507058bd9287d47d51aa7e6110351eb717fbf17e19619a7dc9d32e"
        binary: antigravity
        link: agy
summary:
  en: "Drives the local agy CLI over ACP as a keyless model lane; agy holds the Google sign-in."
  zh: "通过 ACP 驱动本地 agy CLI 作为无密钥模型通道,Google 登录由 agy 保管。"

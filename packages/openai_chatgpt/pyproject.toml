[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-rosetta-ext-openai-chatgpt"
version = "0.5.1"
description = "llm-rosetta extension: The ChatGPT plan (Sign in with ChatGPT) as a provider, over Open Responses"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Oaklight" }]
# Standard library only beyond core: an extension must run where pip is absent.
dependencies = ["llm-rosetta>=0.14.0"]

[project.entry-points."llm_rosetta.extensions"]
openai_chatgpt = "llm_rosetta_ext.openai_chatgpt"

# The folder is the package: no src/ and no inner directory.  The import name
# is mapped onto "." and the packages are listed, so tests/ and the packaging
# files stay out of the wheel.  The shim tree's folders hold no __init__.py,
# so the data files the loader reads are named below.
[tool.setuptools]
package-dir = { "llm_rosetta_ext.openai_chatgpt" = "." }
packages = ["llm_rosetta_ext.openai_chatgpt"]

[tool.setuptools.package-data]
"llm_rosetta_ext.openai_chatgpt" = ["plugin.yaml", "provider.yaml", "llm/provider.yaml", "llm/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]

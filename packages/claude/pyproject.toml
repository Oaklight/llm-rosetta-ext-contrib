[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-rosetta-ext-claude"
version = "0.1.0"
description = "llm-rosetta extension: Anthropic Claude through the official CLI (shim + transport)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Oaklight" }]
# Standard library only beyond core: an extension must run where pip is absent.
dependencies = ["llm-rosetta>=0.14.0"]

# PROPOSED (not in core yet): one entry point that points at the package; core
# reads plugin.yaml beside it, checks `requires`, registers the provider tree
# and the declared transports.  See the repo README, "Open items".
[project.entry-points."llm_rosetta.extensions"]
claude = "llm_rosetta_ext_claude"

# The folder is the package: no src/ and no inner directory.  The import name
# is mapped onto "." and the packages are listed, so tests/ and the packaging
# files stay out of the wheel.
[tool.setuptools]
package-dir = { "llm_rosetta_ext_claude" = "." }
packages = ["llm_rosetta_ext_claude", "llm_rosetta_ext_claude.transport"]

[tool.setuptools.package-data]
llm_rosetta_ext_claude = ["plugin.yaml", "provider.yaml", "llm/*/provider.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

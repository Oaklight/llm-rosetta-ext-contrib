# Claude through the official Claude Code CLI, as a model client.
#
# The lane runs `claude -p` in stream-json mode and hands it the conversation
# as replay frames.  The CLI builds and signs the upstream request itself, so
# the gateway never holds a credential; a Pro/Max subscription is used after
# `claude auth login --claudeai` on the gateway host (`--console` signs in for
# API billing instead).  The vendor manifest declares the lane keyless.
#
# Each turn's CLI points ANTHROPIC_BASE_URL at a per-turn loopback relay.  The
# relay forwards the CLI's one upstream request, drops the CLI's per-request
# annotation messages from the replayed prefix, and moves the cache breakpoint
# onto the turn's last block.  Measured on CLI 2.1.299: over four turns the
# cache-read share rose from a flat 17.4% to 49.9%.
#
# Tools are not declared yet.  The CLI builds the request, and the transport
# does not inject the host's `tools` into it: a live request with a tool
# degraded to text rather than a `tool_use` block.  Tool history (`tool_use`
# / `tool_result`) does replay unchanged, so the gap is only the outbound
# definition.  Declare `capabilities: [text, vision, reasoning, tools]` on a
# model only after that path is fixed and measured.
#
# The CLI's own tool set is off (`--tools ""`), session persistence is off,
# and one turn is one process.  A gateway deployment should cap concurrency
# per lane: each turn costs roughly 250 MB.
name: claude--messages
model_type: llm
format: messages
group_label: Anthropic (Claude)
logo: https://cdn.jsdelivr.net/npm/@lobehub/icons-static-svg@1.104.0/icons/claude.svg

# Images ride through the replay unchanged and a live request against the
# admin panel's test image answered correctly.  Thinking blocks come back from
# the CLI's own stream events (measured on 2.1.299).  Tools stay off until the
# outbound definition reaches the upstream body; see the header.
default_capabilities: [text, vision, reasoning]

connection:
  # The lane is reached by starting a process, not by dialing this host.  It
  # is a placeholder that must be a URL (the transport contract is shared with
  # the HTTP lanes) and is never opened.
  base_url: http://claude.local
  transport: claude_cli
  # The vendor's command.  An absolute path is fine when the binary is not on
  # the gateway's PATH; a provider entry may point at another install.
  cli_argv: ["claude"]
  # Load the user settings that hold the login helper.  Without this the CLI
  # starts with no credential: measured on 2.1.299, the upstream answered 401.
  # The transport's private --settings file still pins ANTHROPIC_BASE_URL to
  # the relay, so a user settings file cannot point the CLI at another host.
  cli_args: ["--setting-sources", "user"]
  # `-p` rewrites an inherited entrypoint of "cli" to "sdk-cli".  A lane-
  # specific value keeps the request tagged as this gateway.  Measured: the
  # User-Agent suffix changes, while `x-app` stays `cli`.  The reference
  # implementation reports a lower subscription burn for this bucket; that
  # rate effect is not reproduced here, so do not promise a number.
  cli_env:
    CLAUDE_CODE_ENTRYPOINT: llm-rosetta
  # The gateway process usually carries Anthropic billing or backend settings.
  # Claude Code gives them precedence over the stored subscription, so remove
  # them: otherwise the lane silently bills the API, calls another host, or
  # moves to Bedrock/Vertex.  The list is CLAUDE_ENV_UNSET in auth.py.
  cli_env_unset:
    - ANTHROPIC_API_KEY
    - ANTHROPIC_AUTH_TOKEN
    - ANTHROPIC_BASE_URL
    - ANTHROPIC_MODEL
    - ANTHROPIC_SMALL_FAST_MODEL
    - ANTHROPIC_DEFAULT_OPUS_MODEL
    - ANTHROPIC_DEFAULT_SONNET_MODEL
    - ANTHROPIC_DEFAULT_HAIKU_MODEL
    - ANTHROPIC_CUSTOM_HEADERS
    - CLAUDE_CODE_USE_BEDROCK
    - CLAUDE_CODE_USE_VERTEX
    - CLAUDE_CODE_USE_FOUNDRY
    - CLAUDE_CODE_USE_ANTHROPIC_AWS
    - CLAUDE_CODE_USE_ANTHROPIC_GOOGLE_CLOUD
    - CLAUDE_CODE_USE_MANTLE
    - CLAUDE_CODE_USE_GATEWAY

hint_msg:
  en: >-
    Runs the official Claude Code CLI as a model client. Sign in once on the
    gateway host with `claude auth login --claudeai` (or the admin panel's
    Sign in button); `--console` signs in for API billing instead. The shim
    removes ANTHROPIC_API_KEY, ANTHROPIC_BASE_URL, the model overrides and the
    cloud backend selectors from the lane's environment, so a gateway process
    that exports them still uses the stored subscription rather than API
    billing or another provider. Each request starts one `claude` process
    (about 250 MB), so cap concurrency per lane. Images and thinking blocks
    work; tool history replays, but a tool definition is not yet sent
    upstream, so do not give a model on this lane the tools capability.
    Anthropic's terms may not allow driving the CLI from another client; use
    an account you can afford to lose. A provider entry may set cli_upstream
    to send the request through an organization gateway instead of Anthropic's
    API.
  zh: >-
    把官方 Claude Code CLI 当作模型客户端运行。先在网关主机上执行
    `claude auth login --claudeai` 登录（或使用管理面板的 Sign in 按钮）；
    `--console` 则按 API 计费登录。本 shim 会从通道环境中移除
    ANTHROPIC_API_KEY、ANTHROPIC_BASE_URL、模型覆盖项以及云后端选择项，
    因此即使网关进程导出了这些变量，仍会使用已保存的订阅，而不是 API 计费或其他供应商。
    每个请求启动一个 `claude` 进程（约 250 MB），请按通道限制并发。
    图片与思考块可用；工具历史可以回放，但工具定义尚未发送到上游，
    因此不要给本通道的模型声明 tools 能力。Anthropic 的条款可能不允许从其他客户端
    驱动该 CLI，请只使用可以承受损失的账号。provider 条目可设置 cli_upstream，
    让请求经过组织网关而不是 Anthropic 的 API。

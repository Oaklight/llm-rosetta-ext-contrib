name: claude--acp
model_type: llm
format: acp
group_label: Anthropic (Claude)
logo: https://cdn.jsdelivr.net/npm/@lobehub/icons-static-svg@1.104.0/icons/claude.svg

# What a model on this lane has when its config entry declares no
# ``capabilities``.  Images ride as inline ACP blocks and thought chunks come
# back as thinking blocks.  A live round trip through the adapter on 0.109.1 /
# Claude Code 2.1.299 is recorded: the request's ``echo`` tool reached Claude
# Code over the loopback MCP bridge, the call suspended the turn, and the
# client's result resumed it.  ``tools`` is therefore on by default.  A model
# that must not receive client tools can declare
# ``capabilities: [text, vision, reasoning]``.
# Needs llm-rosetta 0.14.0.dev35+ (#1675): an earlier 0.14 development core
# accepts ``connection.acp_env`` and silently drops it, leaves tool search on,
# and never calls the bridged tools even though this capability says they are
# available.
default_capabilities: [text, vision, reasoning, tools]

connection:
  # The lane is reached by starting a process, not by dialing this host.  It
  # is a placeholder that must be a URL (the transport contract is shared with
  # the HTTP lanes) and is never opened.
  base_url: http://claude.local
  transport: acp
  # Pin the adapter.  It bundles a native Claude CLI through the Claude Agent
  # SDK, so the host needs Node.js 22+ and npx but no global claude install.
  # The gateway gives every lane its own persistent home under the data
  # directory; the login store lives there, not in the process's ``~/.claude``.
  # Mount the data directory on a volume to keep the login across restarts and
  # image upgrades, and change ``acp.home`` to switch to another saved profile.
  # The admin panel's sign-in drives the CLI this lane runs: the Claude Code
  # build the adapter installed in ``npm_config_cache``, or ``claude`` on the
  # gateway's PATH.  ``CLAUDE_CODE_EXECUTABLE`` forces a specific binary for
  # that sign-in.
  acp_argv: ["npx", "-y", "@agentclientprotocol/claude-agent-acp@0.109.1"]
  # Tool search defers MCP tools behind its own `ToolSearch` call.  That call
  # is a Claude Code built-in, so the gateway's built-in guard ends the turn
  # before the client's tool is ever named.  Turning it off makes the MCP
  # bridge's tools callable directly.  ``{acp_home}`` is the lane's persistent
  # home; the gateway expands it for both the agent and the admin sign-in.
  acp_env:
    ENABLE_TOOL_SEARCH: "false"
    CLAUDE_CONFIG_DIR: "{acp_home}/claude"
    # Keep the adapter package (and the Claude CLI it bundles) in the lane's
    # persistent home.  ``npx`` otherwise caches under the process's HOME,
    # which a container image replaces on every upgrade; on a volume the next
    # image reuses the install instead of downloading it again.
    npm_config_cache: "{acp_home}/npm"
  # The gateway's own environment may carry Anthropic billing settings (a
  # deployment usually does).  Claude Code gives them precedence over the
  # stored subscription, so a lane would silently bill the API or call another
  # host.  These names are removed from both the agent's environment and the
  # admin sign-in's environment; the list is mirrored in ``auth.py`` as
  # ``CLAUDE_ENV_UNSET``.
  acp_env_unset:
    - ANTHROPIC_API_KEY
    - ANTHROPIC_AUTH_TOKEN
    - ANTHROPIC_BASE_URL
    - ANTHROPIC_MODEL
    - ANTHROPIC_SMALL_FAST_MODEL
    - ANTHROPIC_DEFAULT_OPUS_MODEL
    - ANTHROPIC_DEFAULT_SONNET_MODEL
    - ANTHROPIC_DEFAULT_HAIKU_MODEL
    - ANTHROPIC_CUSTOM_HEADERS
    - CLAUDE_CODE_USE_BEDROCK
    - CLAUDE_CODE_USE_VERTEX
    - CLAUDE_CODE_USE_FOUNDRY
    - CLAUDE_CODE_USE_ANTHROPIC_AWS
    - CLAUDE_CODE_USE_ANTHROPIC_GOOGLE_CLOUD
    - CLAUDE_CODE_USE_MANTLE
    - CLAUDE_CODE_USE_GATEWAY
  # This adapter keeps Claude Code's own file, shell and web tools on unless
  # the request says otherwise, and Claude Code may auto-approve a read-only
  # tool without asking the client.  ``disableBuiltInTools`` is the adapter's
  # own switch for ``tools: []``: the agent then offers only the tools the
  # gateway routes over its loopback MCP server.  It is repeated on
  # ``session/load`` and ``session/resume`` because the adapter folds the
  # value into its session fingerprint.  Antigravity needs no such switch: its
  # ``--gemini-dir`` profile and PreToolUse hook already block built-ins.
  acp_session_meta:
    disableBuiltInTools: true

hint_msg:
  en: >-
    Runs the Claude Agent SDK adapter over ACP. Requires Node.js 22+ and npx on
    the gateway host. Sign in once with the Claude Code CLI (or the admin
    panel's Sign in button):
    `claude auth login --claudeai` for a Pro/Max subscription, or
    `claude auth login --console` for API billing. The shim removes
    ANTHROPIC_API_KEY, ANTHROPIC_AUTH_TOKEN, ANTHROPIC_BASE_URL and
    ANTHROPIC_MODEL from the lane's environment, so a gateway process that
    exports them still uses the stored subscription rather than API billing.
    The adapter's built-in tools (files, shell) are disabled on
    this lane, so the model can only use tools the API request declares; those
    are bridged over MCP and their calls and results travel over ACP. The shim
    sets ENABLE_TOOL_SEARCH=false so Claude Code calls them directly. The
    gateway keeps this lane's login under its data directory
    ({acp_home}/claude), so mount that directory on a volume to reuse the
    login after a restart or image upgrade; set acp.home to switch profiles.
    Anthropic's terms may not allow third-party ACP use; use an
    account you can afford to lose.
  zh: >-
    通过 ACP 运行 Claude Agent SDK 适配器。网关主机需要 Node.js 22+ 与 npx。
    先用 Claude Code CLI 登录一次（或用管理面板的 Sign in 按钮）：订阅账号使用
    `claude auth login --claudeai`，API 计费使用
    `claude auth login --console`。本 shim 会从通道环境中移除
    ANTHROPIC_API_KEY、ANTHROPIC_AUTH_TOKEN、ANTHROPIC_BASE_URL 和
    ANTHROPIC_MODEL，因此即使网关进程导出了这些变量，仍会使用已保存的订阅而不是
    API 计费。适配器自带的工具（文件、命令行）已在本通道禁用，
    模型只能使用 API 请求声明的客户端工具；这些工具通过 MCP 桥接，
    调用与结果经 ACP 往返；本 shim 设置 ENABLE_TOOL_SEARCH=false，
    让 Claude Code 直接调用这些工具。网关把本通道的登录保存在数据目录
    ({acp_home}/claude) 下；把数据目录挂载到卷上，重启或升级镜像后仍可复用登录，
    也可设置 acp.home 切换到其他配置。Anthropic 的条款可能不允许第三方 ACP 用法，
    请只使用可以承受损失的账号。

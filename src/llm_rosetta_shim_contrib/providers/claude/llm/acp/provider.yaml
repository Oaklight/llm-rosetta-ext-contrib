name: claude--acp
model_type: llm
format: acp
group_label: Anthropic (Claude)
logo: https://cdn.jsdelivr.net/npm/@lobehub/icons-static-svg@1.104.0/icons/claude.svg

# What a model on this lane has when its config entry declares no
# ``capabilities``.  Images ride as inline ACP blocks and thought chunks come
# back as thinking blocks.  Client tools travel over the loopback MCP bridge;
# ``tools`` stays out of this default until a live round trip through this
# adapter is recorded.  A model entry may opt in with
# ``capabilities: [text, vision, reasoning, tools]``.
default_capabilities: [text, vision, reasoning]

connection:
  # The lane is reached by starting a process, not by dialing this host.  It
  # is a placeholder that must be a URL (the transport contract is shared with
  # the HTTP lanes) and is never opened.
  base_url: http://claude.local
  transport: acp
  # Pin the adapter.  It bundles a native Claude CLI through the Claude Agent
  # SDK, so the host needs Node.js 22+ and npx but no global claude install.
  # A login made with a separately installed `claude` CLI is shared through
  # ~/.claude.  Set CLAUDE_CODE_EXECUTABLE to use a specific CLI binary.
  acp_argv: ["npx", "-y", "@agentclientprotocol/claude-agent-acp@0.109.1"]

hint_msg:
  en: >-
    Runs the Claude Agent SDK adapter over ACP. Requires Node.js 22+ and npx on
    the gateway host. Sign in once with the Claude Code CLI:
    `claude auth login --claudeai` for a Pro/Max subscription, or
    `claude auth login --console` for API billing. Do not set
    ANTHROPIC_API_KEY: Claude Code then bills the API instead of the
    subscription. The adapter runs Claude Code, whose built-in tools (files,
    shell) are refused by the gateway when it asks for permission; Claude Code
    may auto-approve read-only tools without asking, so the lane cannot
    guarantee it never reads the host. Client tools declared by the API request
    are bridged over MCP, so tool calls and results travel over ACP. Anthropic's
    terms may not allow third-party ACP use; use an account you can afford to
    lose.
  zh: >-
    通过 ACP 运行 Claude Agent SDK 适配器。网关主机需要 Node.js 22+ 与 npx。
    先用 Claude Code CLI 登录一次：订阅账号使用
    `claude auth login --claudeai`，API 计费使用
    `claude auth login --console`。不要设置 ANTHROPIC_API_KEY，否则 Claude Code
    会改用 API 计费而不是订阅。适配器运行 Claude Code，其自带工具（文件、命令行）
    在请求权限时会被网关拒绝；但 Claude Code 可能自动批准只读工具而不询问，
    因此本通道无法保证它绝不读取主机文件。API 请求声明的客户端工具通过 MCP 桥接，
    工具调用与结果经 ACP 往返。Anthropic 的条款可能不允许第三方 ACP 用法，
    请只使用可以承受损失的账号。
